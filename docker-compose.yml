# StockFlow — full stack (infra + Go microservices)
#
# Start:  docker compose up --build
# Stop:   docker compose down
# Logs:   docker compose logs -f
#
# Docker networking: use service names (postgres, redis, api-gateway, …)
# not localhost, when connecting from inside containers.

x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD:-stockflow}@postgres:5432/${POSTGRES_DB:-stockflow}?sslmode=disable
  REDIS_URL: redis://redis:6379
  GIN_MODE: release
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
  POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
  POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}

services:
  postgres:
    image: postgres:17-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: stockflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - stockflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: stockflow-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *backend-env
      PORT: "8080"
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:8084
      MARKET_SERVICE_URL: http://market-service:8082
      WEBSOCKET_SERVICE_URL: http://websocket-service:8083
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://*.vercel.app}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      market-service:
        condition: service_started
    networks:
      - stockflow-network

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: stockflow-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-8084}:8084"
    environment:
      <<: *backend-env
      PORT: "8084"
      SERVICE_NAME: auth-service
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockflow-network

  market-service:
    build:
      context: ./backend
      dockerfile: market-service/Dockerfile
    container_name: stockflow-market-service
    restart: unless-stopped
    ports:
      - "${MARKET_SERVICE_PORT:-8082}:8082"
    environment:
      <<: *backend-env
      PORT: "8082"
      SERVICE_NAME: market-service
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      MARKET_PUBSUB_CHANNEL: ${MARKET_PUBSUB_CHANNEL:-market:updates}
      MARKET_DEFAULT_SYMBOLS: ${MARKET_DEFAULT_SYMBOLS:-AAPL,MSFT,GOOGL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockflow-network

  websocket-service:
    build:
      context: ./backend
      dockerfile: websocket-service/Dockerfile
    container_name: stockflow-websocket-service
    restart: unless-stopped
    ports:
      - "${WEBSOCKET_SERVICE_PORT:-8083}:8083"
    environment:
      <<: *backend-env
      PORT: "8083"
      SERVICE_NAME: websocket-service
      MARKET_PUBSUB_CHANNEL: ${MARKET_PUBSUB_CHANNEL:-market:updates}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WS_REQUIRE_AUTH: ${WS_REQUIRE_AUTH:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-service:
        condition: service_started
    networks:
      - stockflow-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: stockflow-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - stockflow-network
    depends_on:
      - api-gateway
      - auth-service
      - market-service
      - websocket-service

  grafana:
    image: grafana/grafana:11.3.0
    container_name: stockflow-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stockflow-network
    depends_on:
      - prometheus

networks:
  stockflow-network:
    name: stockflow-network
    driver: bridge

volumes:
  postgres_data:
    name: stockflow-postgres-data
  redis_data:
    name: stockflow-redis-data
  grafana_data:
    name: stockflow-grafana-data
